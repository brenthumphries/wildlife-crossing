name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Pinned per ADR 0012: Godot 4.6.3-stable + GUT 9.6.0 (vendored at game/addons/gut/).
# Pinned to the exact patch, not the 4.6-stable series: export-template directories
# are version-keyed, and a floating patch means CI and the local tools/ binary can
# silently build against different engines. That drift already cost one
# misdiagnosis (2026-07-27). Bump this and both job names together.
env:
  GODOT_VERSION: 4.6.3-stable

jobs:
  # Everything in tools/ was untested until 2026-08-09, which was tolerable
  # while those scripts only read and reported. tools/ship.py stages and
  # commits, and its value is the set of things it refuses to do, so its
  # refusals need a gate. Stdlib unittest only — no pip install step, nothing
  # to add to THIRD-PARTY-NOTICES.md. Runs in seconds and needs no engine, so
  # it is deliberately not a dependency of the jobs below.
  tools:
    name: Tool tests (Python, stdlib unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No git identity is configured here on purpose. An earlier version of
      # this job set a global user.name/user.email "for the fixtures", which
      # broke the one test that asserts ship.py refuses to commit without an
      # identity: that test unsets only the *local* identity, so git answered
      # from the global fallback and the refusal never fired. The fixtures now
      # redirect HOME, GIT_CONFIG_GLOBAL and GIT_CONFIG_SYSTEM at a throwaway
      # directory and write their own local identity, so they need nothing from
      # the runner. A bare checkout is the correct environment, and
      # test_fixture_identity_comes_only_from_the_repo fails if that stops
      # being true.
      - name: Run tool tests
        run: python3 -m unittest discover -s tools/tests -b

  # CONTRIBUTING.md requires a Signed-off-by trailer on every commit and, until
  # now, nothing enforced it. ADR 0017 is why it matters beyond bookkeeping:
  # with a DCO and no CLA, the first merged outside contribution is the point of
  # no return on the licensing model, and a missing trailer costs a history
  # rewrite on a public branch once it has landed.
  #
  # Pull requests only, and only the commits the pull request *adds*. 33 of the
  # 40 commits on main as of 2026-08-10 predate CONTRIBUTING.md and carry no
  # trailer — all of them by the copyright holder, so there is nothing to
  # attest — and a check that read whole history would leave main permanently
  # red. A permanently red check teaches everyone to scroll past it.
  #
  # Direct pushes to main are not gated here: that path is tools/ship.py, which
  # refuses to commit without a sign-off and adds the trailer itself.
  dco:
    name: DCO sign-off (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required, not tidiness — a shallow clone has no base
      # ref to diff against, and check_dco.py exits 2 with that diagnosis rather
      # than reporting a green it did not earn.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off on this pull request's commits
        run: |
          set -euo pipefail
          python3 tools/check_dco.py "origin/${GITHUB_BASE_REF}" HEAD

  test:
    # Version inlined: the `env` context is not available in job names.
    name: GUT tests (Godot 4.6.3-stable headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned Godot headless binary
        run: |
          set -euo pipefail
          BASE="Godot_v${GODOT_VERSION}_linux.x86_64"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${BASE}.zip"
          wget -q "$URL"
          unzip -q "${BASE}.zip"
          sudo mv "${BASE}" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import project (build resource cache)
        working-directory: game
        run: godot --headless --import

      - name: Run GUT test suite
        working-directory: game
        run: >
          godot --headless -s addons/gut/gut_cmdln.gd
          -gdir=res://tests -ginclude_subdirs
          -gjunit_xml_file=res://gut_results.xml -gexit

      # V1: a suite that collects zero tests exits green, which would let a
      # broken discovery config (bad -gdir, wrong suffix) pass CI silently.
      # Fail the build unless GUT actually recorded at least one test case.
      - name: Guard against a silently-empty suite
        working-directory: game
        run: |
          set -euo pipefail
          XML=gut_results.xml
          if [ ! -f "$XML" ]; then
            echo "::error::GUT wrote no results file ($XML) — cannot confirm any tests ran."
            exit 1
          fi
          TESTS="$(grep -oE '<testcase' "$XML" | wc -l | tr -d '[:space:]')"
          echo "GUT recorded ${TESTS} test case(s)."
          if [ "${TESTS:-0}" -eq 0 ]; then
            echo "::error::GUT collected zero tests — failing the build (V1 zero-tests guard)."
            exit 1
          fi

  export:
    # Version inlined: the `env` context is not available in job names.
    name: Export desktop builds (Godot 4.6.3-stable headless)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned Godot headless binary
        run: |
          set -euo pipefail
          BASE="Godot_v${GODOT_VERSION}_linux.x86_64"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${BASE}.zip"
          wget -q "$URL"
          unzip -q "${BASE}.zip"
          sudo mv "${BASE}" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install matching export templates
        run: |
          set -euo pipefail
          TPZ="Godot_v${GODOT_VERSION}_export_templates.tpz"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${TPZ}"
          wget -q "$URL"
          # Template dir name is the version string Godot reports (e.g. 4.6.stable).
          VER="$(godot --version | grep -oE '^[0-9]+\.[0-9]+(\.[0-9]+)?\.[a-z]+')"
          DEST="$HOME/.local/share/godot/export_templates/${VER}"
          mkdir -p "$DEST"
          unzip -q "$TPZ" -d /tmp/templates
          mv /tmp/templates/templates/* "$DEST/"

      - name: Import project (build resource cache)
        working-directory: game
        run: godot --headless --import

      - name: Export desktop presets
        working-directory: game
        run: |
          set -euo pipefail
          mkdir -p ../builds/wildlife-crossing-linux-x86_64 \
                   ../builds/wildlife-crossing-windows-x86_64 \
                   ../builds/wildlife-crossing-macos
          godot --headless --export-release "Linux x86_64" \
            ../builds/wildlife-crossing-linux-x86_64/wildlife-crossing.x86_64
          godot --headless --export-release "Windows x86_64" \
            ../builds/wildlife-crossing-windows-x86_64/wildlife-crossing.exe
          godot --headless --export-release "macOS" \
            ../builds/wildlife-crossing-macos/wildlife-crossing.zip

      # V1: every other gate in this project inspects the *source tree* — the
      # GUT suite, the zero-tests guard, this job's exit status. None of them
      # can see inside the artifact, which is why a 2026-07-28 review spent a
      # day mis-diagnosing the pack's contents by string-scanning it. Read the
      # pack directory properly and assert what has to be in there.
      #
      # V2 (2026-08-10): all three packs, not just Linux. The Windows pack is
      # not byte-identical to the Linux one — md5 a2dbbbee… against 934e8b12…,
      # measured in the 2026-08-04 review — so "the Linux pack is fine" was
      # never evidence about the other two, and under ADR 0018 the Windows
      # binary goes into a public Release having been checked by nothing.
      # The macOS pack lives inside the .app inside the zip, and is named from
      # config/name rather than the export path; check_pck_contents.py globs
      # for it rather than reconstructing the name.
      #
      # Every pack is checked even after one fails. Three platforms diverging
      # in three different ways is one report worth reading; the first failure
      # alone sends you round the loop twice. Same reasoning smoke_boot.sh
      # gives for always running both of its boots.
      - name: Verify every exported pack's contents
        run: |
          set -uo pipefail
          failed=0
          for target in \
            builds/wildlife-crossing-linux-x86_64/wildlife-crossing.pck \
            builds/wildlife-crossing-windows-x86_64/wildlife-crossing.pck \
            builds/wildlife-crossing-macos/wildlife-crossing.zip
          do
            echo "::group::pack gate — ${target}"
            python3 tools/check_pck_contents.py "$target" \
              --data-dir game/data --github || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      # Runs the binary rather than reading the pack, so it catches failures the
      # contents check cannot: a bad main scene, a crash in _ready(), a missing
      # export template. See tools/smoke_boot.sh for why `head -20` was wrong.
      - name: Smoke-test the Linux binary (boots to Main.tscn)
        run: |
          bash tools/smoke_boot.sh \
            ./builds/wildlife-crossing-linux-x86_64/wildlife-crossing.x86_64 20

      # Godot's export templates statically link the engine into every binary,
      # and Godot is MIT — its notice has to travel with every copy we ship.
      # See ADR 0017. Runs with `always()` and tolerates missing directories so
      # a failed preset cannot strip the notices off the presets that worked.
      #
      # Known gap: the macOS preset exports a .zip, so these land beside the
      # archive rather than inside the .app bundle. The durable fix is an
      # in-game credits screen built from Engine.get_copyright_info(); until
      # then, don't repackage the macOS build without carrying these along.
      - name: Bundle license notices with each build
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in builds/*/; do
            cp LICENSE THIRD-PARTY-NOTICES.md "$dir"
            echo "notices -> $dir"
          done

      # Upload whatever exported, even if a later preset or the smoke test
      # failed. A single bad preset previously discarded working Linux and
      # Windows binaries for 16 days (see 2026-07-27 daily log).
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-crossing-desktop-builds
          path: builds/

  # V2, second half: boot a non-Linux binary. Windows rather than macOS because
  # of who can check what by hand — the product owner has a Mac, so the macOS
  # build gets launched and watched during every visual QA and signing session
  # (signing-runbook.md A8). Nobody here owns a Windows machine, so without this
  # job the .exe ships to a public Release having never been executed by
  # anything, anywhere. That is the gap worth spending a runner on.
  #
  # It re-uses tools/smoke_boot.sh unchanged: Git Bash on windows-latest
  # provides bash, timeout and stdbuf, which is everything the script probes
  # for. The script already handles the non-Linux case it was written for
  # (Brent's Mac) the same way.
  smoke-windows:
    name: Smoke-test the Windows binary (boots to Main.tscn)
    needs: export
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the exported builds
        uses: actions/download-artifact@v4
        with:
          name: wildlife-crossing-desktop-builds
          path: builds

      # A Windows .exe carries no executable bit, and smoke_boot.sh refuses a
      # target that is not `-x`. Setting it in the runner's POSIX layer is
      # cheaper and clearer than teaching the script a platform exception.
      - name: Boot the Windows binary headless
        shell: bash
        run: |
          set -euo pipefail
          BIN=builds/wildlife-crossing-windows-x86_64/wildlife-crossing.exe
          test -f "$BIN" || { echo "::error::no Windows binary in the artifact"; exit 1; }
          chmod +x "$BIN"
          bash tools/smoke_boot.sh "$BIN" 30
          retention-days: 14
